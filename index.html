<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Constitution Watch</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: url('123RFUSFlagTopWhiteBKG.jpg') no-repeat center center fixed;
    background-size: cover;
    opacity: 0.2; /* adjust as needed */
    z-index: -1;
  }

  .overlay {
    background: rgba(0, 0, 0, 0.65);
    padding: 2rem;
    border-radius: 10px;
    text-align: center;
    max-width: 500px;
    z-index: 1;
  }

  a {
    color: #a8dfff;
    text-decoration: underline;
  }

  h1 {
    margin-top: 0;
  }
</style>

</head>
<body>
  <div class="overlay">
    <h1>Constitution Watch</h1>
    <p>A demo for this project is now live <a href="https://constitutionwatch.onrender.com/"_blank">here on Render</a>.</p>
  </div>
</body>
</html>
